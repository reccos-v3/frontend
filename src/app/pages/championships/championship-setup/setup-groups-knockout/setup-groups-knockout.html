<div class="space-y-6">
  <!-- Capacidade do Torneio -->
  <div
    class="bg-gray-50 dark:bg-gray-800/50 p-5 rounded-2xl border border-gray-100 dark:border-gray-700"
  >
    <app-setup-team-counter
      title="Capacidade do Torneio"
      description="Total de participantes inscritos"
      icon="groups"
      [value]="totalTeams()"
      (updateValue)="onUpdateTotalTeams($event)"
    />
  </div>

  <!-- Configuração de Grupos e Wildcards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    @for (field of configFields(); track field.id) {
      <div
        class="bg-gray-50 dark:bg-gray-800 p-5 rounded-2xl border border-gray-100 dark:border-gray-700"
      >
        <div class="flex items-center gap-4 mb-3">
          <span
            class="material-symbols-outlined"
            [ngClass]="{
              'text-blue-500': field.iconColor === 'blue',
              'text-green-500': field.iconColor === 'green',
              'text-purple-500': field.iconColor === 'purple',
            }"
          >
            {{ field.icon }}
          </span>
          <label
            [for]="field.id"
            class="block text-xs font-bold uppercase tracking-wider text-secondary"
          >
            {{ field.label }}
          </label>
        </div>

        <div class="flex items-center gap-4">
          <div
            class="relative flex-1 flex items-center justify-between bg-gray-50 dark:bg-gray-900 rounded-xl px-2 py-1"
          >
            <button
              type="button"
              (click)="field.onUpdate(-1)"
              class="p-1 hover:text-orange-500 transition-colors"
            >
              <span class="material-symbols-outlined">remove</span>
            </button>

            <span class="font-bold dark:text-white">
              {{ field.getValue() }}
            </span>

            <button
              type="button"
              (click)="field.onUpdate(1)"
              class="p-1 hover:text-orange-500 transition-colors"
            >
              <span class="material-symbols-outlined">add</span>
            </button>
          </div>
        </div>
      </div>
    }
  </div>

  <!-- Alertas de Validação e Estrutura -->
  <div class="space-y-3">
    @for (alert of validationAlerts(); track alert.title) {
      <app-alert
        [type]="alert.type"
        variant="left-accent"
        [title]="alert.title"
        [message]="alert.message"
      />
    }
  </div>
</div>
