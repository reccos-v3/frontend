<div class="space-y-6">
  <!-- Capacidade do Torneio -->
  <div
    class="bg-gray-50 dark:bg-gray-800/50 p-5 rounded-2xl border border-gray-100 dark:border-gray-700"
  >
    <app-setup-team-counter
      title="Capacidade do Torneio"
      description="Total de participantes inscritos"
      icon="groups"
      [value]="totalTeams()"
      (updateValue)="onUpdateTotalTeams($event)"
    />
  </div>

  <!-- Configuração de Grupos e Wildcards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    @for (field of configFields(); track field.id) {
      <div
        class="bg-white dark:bg-gray-800 p-5 rounded-2xl border border-gray-100 dark:border-gray-700"
      >
        <label
          [for]="field.id"
          class="block text-xs font-bold uppercase tracking-wider text-secondary mb-3"
        >
          {{ field.label }}
        </label>

        <div class="flex items-center gap-4">
          <div
            class="h-10 w-10 flex items-center justify-center rounded-lg"
            [ngClass]="{
              'bg-blue-50 dark:bg-blue-900/20': field.iconColor === 'blue',
              'bg-green-50 dark:bg-green-900/20': field.iconColor === 'green',
              'bg-purple-50 dark:bg-purple-900/20': field.iconColor === 'purple',
            }"
          >
            <span
              class="material-symbols-outlined"
              [ngClass]="{
                'text-blue-500': field.iconColor === 'blue',
                'text-green-500': field.iconColor === 'green',
                'text-purple-500': field.iconColor === 'purple',
              }"
            >
              {{ field.icon }}
            </span>
          </div>

          <div
            class="relative flex-1 flex items-center justify-between bg-gray-50 dark:bg-gray-900 rounded-xl px-2 py-1"
          >
            <button
              type="button"
              (click)="field.onUpdate(-1)"
              class="p-1 hover:text-orange-500 transition-colors"
            >
              <span class="material-symbols-outlined">remove</span>
            </button>

            <span class="font-bold dark:text-white">
              {{ field.getValue() }}
            </span>

            <button
              type="button"
              (click)="field.onUpdate(1)"
              class="p-1 hover:text-orange-500 transition-colors"
            >
              <span class="material-symbols-outlined">add</span>
            </button>
          </div>
        </div>
      </div>
    }
  </div>

  <!-- Alertas de Validação e Estrutura -->
  <div class="space-y-3">
    @for (alert of validationAlerts(); track alert.title) {
      <div
        class="p-4 rounded-xl border-l-4"
        [ngClass]="{
          'bg-blue-50 border-blue-500 dark:bg-blue-900/20': alert.type === 'info',
          'bg-red-50 border-red-500 dark:bg-red-900/20': alert.type === 'error',
          'bg-green-50 border-green-500 dark:bg-green-900/20': alert.type === 'success',
        }"
      >
        <div class="flex gap-3">
          <span
            class="material-symbols-outlined"
            [ngClass]="{
              'text-blue-500': alert.type === 'info',
              'text-red-500': alert.type === 'error',
              'text-green-500': alert.type === 'success',
            }"
          >
            {{ alert.type === 'info' ? 'info' : alert.type === 'error' ? 'report' : 'verified' }}
          </span>

          <div>
            <h4 class="text-sm font-bold">
              {{ alert.title }}
            </h4>

            <p class="text-xs mt-1">
              {{ alert.message }}
            </p>
          </div>
        </div>
      </div>
    }
  </div>
</div>
