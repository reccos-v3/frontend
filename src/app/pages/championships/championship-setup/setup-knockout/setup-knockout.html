<div class="space-y-10">
  <div class="grid grid-cols-1 lg:grid-cols-5 gap-8 items-start">
    <!-- Bloco 1: Contador de Times -->
    <app-setup-team-counter
      class="block bg-gray-50 dark:bg-gray-800/50 p-6 rounded-2xl border border-gray-100 dark:border-gray-700 lg:col-span-2"
      title="Número de Times na Chave"
      description="Defina a quantidade de participantes no mata-mata"
      icon="trophy"
      [value]="totalTeams()"
      (updateValue)="onUpdateTotalTeams($event)"
    />

    <!-- Bloco 2: Simulador de Bye Policy -->
    <app-setup-bye-policy
      class="block lg:col-span-3"
      [selectedPolicy]="byePolicy()"
      [totalTeams]="totalTeams()"
      (updatePolicy)="updateByePolicy.emit($event)"
    />
  </div>

        [message]="alert.message"
      />
    }
  </div> -->
</div>
