<section
  class="bg-white dark:bg-slate-900 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 h-full"
>
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-primary">sort</span>
      <h3 class="font-bold text-lg">Critérios de Desempate</h3>
    </div>
    <button
      (click)="openModal.emit()"
      class="text-sm font-bold text-primary hover:text-primary transition-colors"
    >
      + Adicionar critério
    </button>
  </div>

  <div class="space-y-2">
    @for (tiebreak of tiebreaks(); track $index) {
      <!-- ITEM FIXO -->
      @if (tiebreak.code === 'POINTS') {
        <div
          class="flex items-center gap-4 p-4 bg-primary/10 border border-primary/20 rounded-lg opacity-80 cursor-not-allowed"
        >
          <span class="material-symbols-outlined text-slate-400">lock</span>
          <span class="font-bold text-primary"> 1º {{ tiebreak.name }} </span>
          <span
            class="ml-auto text-xs font-medium text-primary bg-primary/10 px-2 py-1 rounded uppercase"
          >
            Fixo
          </span>
        </div>
      } @else {
        <!-- DRAGGABLE ITEM -->
        <div
          class="flex items-center gap-4 p-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg hover:border-primary/50 transition-colors shadow-sm group"
          draggable="true"
          (dragstart)="onDragStart($index)"
          (dragover)="onDragOver($event, $index)"
          (dragleave)="onDragLeave()"
          (drop)="onDrop($index)"
        >
          <span
            class="material-symbols-outlined text-slate-300 group-hover:text-primary cursor-move"
          >
            drag_indicator
          </span>

          <div class="flex items-center gap-3">
            <span
              class="flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 dark:bg-slate-800 text-xs font-bold"
            >
              {{ $index + 1 }}
            </span>
            <span class="font-medium">
              {{ tiebreak.name }}
            </span>
          </div>

          <button
            (click)="removeTiebreak.emit($index)"
            class="ml-auto text-slate-400 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100"
          >
            <span class="material-symbols-outlined">delete</span>
          </button>
        </div>
      }
    }
  </div>
</section>
