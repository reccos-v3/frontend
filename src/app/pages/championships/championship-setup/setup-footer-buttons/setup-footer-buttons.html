<footer
  class="fixed bottom-0 left-0 md:left-64 right-0 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 shadow-[0_-10px_40px_rgba(0,0,0,0.08)] z-50 transition-all"
>
  <div class="max-w-[1100px] mx-auto px-4 py-2 flex items-center justify-between">
    <button
      class="flex items-center gap-2 px-6 py-2 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-400 font-semibold text-sm hover:bg-slate-100 dark:hover:bg-slate-800 transition-all"
      (click)="eventClickConfirmButton.emit('returnHub')"
    >
      <span class="material-symbols-outlined text-sm"> arrow_back </span>
      Voltar ao Hub
    </button>

    <button
      (click)="eventClickConfirmButton.emit('saveAndContinue')"
      [disabled]="!isValid()"
      class="flex items-center gap-2 px-6 py-2 rounded-lg bg-primary text-white text-sm font-bold hover:brightness-110 active:scale-95 transition-all shadow-lg shadow-primary/20 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      <span class="material-symbols-outlined text-sm"> save </span> Salvar Regras
    </button>
  </div>
</footer>
