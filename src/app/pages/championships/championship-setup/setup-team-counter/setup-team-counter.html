<div class="space-y-6">
  <!-- Header: Row 1 -->
  <div class="flex items-center gap-3">
    <div class="h-10 w-10 flex items-center justify-center bg-primary/10 rounded-lg shrink-0">
      <span class="material-symbols-outlined text-primary">{{ icon() }}</span>
    </div>
    <div>
      <h3 class="font-bold text-main dark:text-white leading-tight">{{ title() }}</h3>
      <p class="text-[11px] text-secondary italic">{{ description() }}</p>
    </div>
  </div>

  <!-- Counter Controls: Row 2 -->
  <div class="flex items-center justify-center gap-4 py-2">
    <button
      type="button"
      (click)="updateValue.emit(-1)"
      [disabled]="manualInput()"
      class="size-14 flex items-center justify-center bg-white dark:bg-gray-800 rounded-2xl shadow-sm hover:bg-gray-100 dark:hover:bg-gray-700 text-main dark:text-white border border-gray-200 dark:border-gray-700 transition-colors active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed disabled:active:scale-100"
    >
      <span class="material-symbols-outlined font-bold text-2xl">remove</span>
    </button>

    <div
      class="flex-1 max-w-[120px] transition-all"
      [class.ring-2]="manualInput()"
      [class.ring-primary/20]="manualInput()"
      [class.bg-primary/5]="manualInput()"
      [class.rounded-xl]="manualInput()"
    >
      <input
        class="w-full text-center bg-transparent border border-transparent outline-none focus:border-gray-100 focus:ring-0 font-black text-5xl text-primary dark:text-white rounded-xl p-2 transition-all [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
        [readonly]="!manualInput()"
        type="number"
        [value]="value()"
        (input)="setAbsoluteValue($event)"
      />
      <span
        class="text-[10px] text-secondary font-bold uppercase block text-center mt-1 tracking-widest"
        >{{ label() }}</span
      >
    </div>

    <button
      type="button"
      (click)="updateValue.emit(1)"
      [disabled]="manualInput()"
      class="size-14 flex items-center justify-center bg-white dark:bg-gray-800 rounded-2xl shadow-sm hover:bg-gray-100 dark:hover:bg-gray-700 text-main dark:text-white border border-gray-200 dark:border-gray-700 transition-colors active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed disabled:active:scale-100"
    >
      <span class="material-symbols-outlined font-bold text-2xl">add</span>
    </button>
  </div>

  <!-- Mode Selector: Row 3 -->
  <div class="flex justify-center">
    <div
      class="relative flex bg-gray-100 dark:bg-gray-800/50 p-1 rounded-xl border border-gray-200 dark:border-gray-700/50 w-3/4"
    >
      <!-- Sliding Background -->
      <div
        class="absolute top-1 bottom-1 w-[calc(50%-4px)] bg-white dark:bg-gray-700 rounded-lg shadow-sm transition-all duration-300 ease-out z-0"
        [class.translate-x-0]="!manualInput()"
        [class.translate-x-full]="manualInput()"
      ></div>

      <button
        type="button"
        (click)="manualInput.set(false)"
        class="relative z-10 flex-1 px-4 py-1.5 flex items-center justify-center gap-2 rounded-lg transition-colors group"
        [class.text-primary]="!manualInput()"
        [class.text-secondary]="manualInput()"
      >
        <span
          class="material-symbols-outlined text-[18px] transition-transform group-hover:scale-110"
          >ads_click</span
        >
        <span class="text-[10px] font-bold uppercase tracking-tighter">Ajuste</span>
      </button>

      <button
        type="button"
        (click)="manualInput.set(true)"
        class="relative z-10 flex-1 px-4 py-1.5 flex items-center justify-center gap-2 rounded-lg transition-colors group"
        [class.text-primary]="manualInput()"
        [class.text-secondary]="!manualInput()"
      >
        <span
          class="material-symbols-outlined text-[18px] transition-transform group-hover:scale-110"
          >keyboard</span
        >
        <span class="text-[10px] font-bold uppercase tracking-tighter">Manual</span>
      </button>
    </div>
  </div>
</div>
