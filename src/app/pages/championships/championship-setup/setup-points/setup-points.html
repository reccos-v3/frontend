<section
  class="bg-white dark:bg-slate-900 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800"
>
  <div class="flex items-center gap-2 mb-6">
    <div class="bg-primary/10 p-2 rounded-lg">
      <span class="material-symbols-outlined text-primary">scoreboard</span>
    </div>
    <h3 class="font-bold text-lg">Pontuação</h3>
  </div>
  <div class="space-y-6">
    <div
      class="flex items-center justify-between p-4 bg-background-light dark:bg-slate-800 rounded-lg border border-slate-100 dark:border-slate-700"
    >
      <label class="font-medium" for="win-points">Vitória</label>
      <div class="flex items-center gap-3">
        <input
          class="w-16 bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-600 rounded text-center font-bold focus:ring-primary focus:border-primary"
          id="win-points"
          type="number"
          value="3"
        />
        <span class="text-slate-400 text-sm">pts</span>
      </div>
    </div>
    <!-- Draw -->
    <div
      class="flex items-center justify-between p-4 bg-background-light dark:bg-slate-800 rounded-lg border border-slate-100 dark:border-slate-700"
    >
      <label class="font-medium" for="draw-points">Empate</label>
      <div class="flex items-center gap-3">
        <input
          class="w-16 bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-600 rounded text-center font-bold focus:ring-primary focus:border-primary"
          id="draw-points"
          type="number"
          value="1"
        />
        <span class="text-slate-400 text-sm">pts</span>
      </div>
    </div>
    <!-- Loss -->
    <div
      class="flex items-center justify-between p-4 bg-background-light dark:bg-slate-800 rounded-lg border border-slate-100 dark:border-slate-700"
    >
      <label class="font-medium" for="loss-points">Derrota</label>
      <div class="flex items-center gap-3">
        <input
          class="w-16 bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-600 rounded text-center font-bold focus:ring-primary focus:border-primary"
          id="loss-points"
          type="number"
          value="0"
        />
        <span class="text-slate-400 text-sm">pts</span>
      </div>
    </div>
    <!-- Toggle Games -->
    <div class="pt-4 border-t border-slate-100 dark:border-slate-800">
      <label class="relative inline-flex items-center cursor-pointer">
        <input checked="" class="sr-only peer" type="checkbox" value="" />
        <div
          class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"
        ></div>
        <span class="ml-3 text-sm font-medium text-slate-700 dark:text-slate-300"
          >Habilitar Jogos de Ida e Volta</span
        >
      </label>
      <p class="mt-2 text-xs text-slate-400 italic">
        Cada confronto terá dois jogos (turno e returno).
      </p>
    </div>
  </div>
</section>
