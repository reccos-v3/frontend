<div class="flex flex-col gap-8">
  <div class="mb-10">
    <h2 class="text-3xl font-bold mb-2">Configurar Regras de Pontuação</h2>
    <p class="text-slate-500">
      Defina como o campeonato será pontuado e os critérios em caso de igualdade.
    </p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
    <div class="lg:col-span-5 space-y-6">
      <app-setup-points [form]="rulesForm" [embedded]="true" />
      <div class="mt-6">
        <app-alert
          type="info"
          variant="left-accent"
          title="Nota Importante"
          icon="info"
          message="O total de <strong>Pontos</strong> é sempre o primeiro critério de classificação e não pode ser reordenado."
        />
      </div>
    </div>

    <div class="lg:col-span-7">
      <app-setup-tiebreaks
        [tiebreaks]="tiebreaks()"
        (openModal)="openModal()"
        (removeTiebreak)="removeTiebreak($event)"
        (reorderTiebreaks)="onTiebreaksReordered($event)"
      />
    </div>
  </div>

  <app-setup-footer-buttons
    [isValid]="isValid()"
    (eventClickConfirmButton)="eventClickConfirmButton($event)"
  />
</div>

@if (showModal()) {
  <app-tiebreak-criteria-modal
    [availableTiebreaks]="availableTiebreaks()"
    [initialSelectedIds]="tempSelectedIds()"
    (modalClose)="closeModal()"
    (modalConfirm)="onTiebreaksConfirmed($event)"
  />
}
