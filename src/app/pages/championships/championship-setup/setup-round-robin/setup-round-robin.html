<div class="space-y-6">
  <!-- Main Configuration Card: Total Teams -->
  <div
    class="bg-gray-50 dark:bg-gray-800/50 p-5 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm"
  >
    <app-setup-team-counter
      title="Participantes da Liga"
      description="Times que disputarão ponto a ponto"
      icon="leaderboard"
      [value]="totalTeams()"
      (updateValue)="onUpdateTotalTeams($event)"
    />
  </div>

  <!-- League Settings Card -->
  <div class="mt-8 pt-6 border-t border-gray-100 dark:border-gray-700">
    <button
      type="button"
      class="flex items-center p-4 bg-gray-50 dark:bg-gray-700/50 rounded-2xl cursor-pointer hover:bg-primary/5 transition-all group border-2 border-transparent w-full text-left"
      [class.border-primary/20]="isDoubleRound()"
      (click)="toggleDoubleRound()"
      [attr.aria-pressed]="isDoubleRound()"
    >
      <div class="relative inline-flex items-center mr-4">
        <input type="checkbox" class="sr-only" [checked]="isDoubleRound()" aria-hidden="true" />

        <div
          class="w-11 h-6 rounded-full transition-all duration-300 relative"
          [class.bg-primary]="isDoubleRound()"
          [class.bg-gray-200]="!isDoubleRound()"
          [class.dark:bg-gray-600]="!isDoubleRound()"
        >
          <div
            class="absolute top-[2px] left-[2px] bg-white border border-gray-300 rounded-full h-5 w-5 transition-all duration-300 shadow-sm"
            [style.transform]="isDoubleRound() ? 'translateX(100%)' : 'translateX(0)'"
          ></div>
        </div>
      </div>

      <div class="flex-1">
        <span
          class="text-sm font-bold text-main dark:text-white group-hover:text-primary transition-colors"
        >
          Sistema de Turno e Returno
        </span>

        <p class="text-xs text-secondary">
          {{ isDoubleRound() ? 'Habilita jogos de ida e volta' : 'Apenas jogos de ida' }}
        </p>
      </div>

      <span
        class="material-symbols-outlined text-primary transition-all"
        [style.opacity]="isDoubleRound() ? '1' : '0.3'"
      >
        {{ isDoubleRound() ? 'check_circle' : 'radio_button_unchecked' }}
      </span>
    </button>
  </div>
</div>
