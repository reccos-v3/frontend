<div
  class="fixed inset-0 z-[100] flex items-center justify-center p-4 backdrop-blur-md bg-black/40 animate-in fade-in duration-300"
>
  <div
    class="w-full max-w-2xl bg-white dark:bg-surface-dark rounded-[2.5rem] shadow-2xl border border-white/20 dark:border-white/10 overflow-hidden flex flex-col max-h-[90vh] animate-in zoom-in-95 duration-300"
  >
    <!-- Modal Header -->
    <div
      class="px-8 pt-8 pb-6 flex items-center justify-between border-b border-border-light dark:border-border-dark"
    >
      <div class="flex flex-col gap-1">
        <h3 class="text-2xl font-bold text-text-main dark:text-white">Adicionar Critérios</h3>
        <p class="text-sm text-text-secondary dark:text-gray-400">
          Selecione os critérios de desempate desejados
        </p>
      </div>
      <button
        (click)="closeModal()"
        class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
      >
        <span class="material-symbols-outlined text-text-secondary">close</span>
      </button>
    </div>

    <!-- Modal Content -->
    <div class="p-8 overflow-y-auto custom-scrollbar">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        @for (item of availableTiebreaks(); track item.id) {
          <button
            (click)="item.code !== 'POINTS' ? toggleTiebreak(item) : null"
            class="relative group p-4 rounded-2xl border-2 transition-all cursor-pointer select-none"
            [class.border-primary]="isSelected(item.id)"
            [class.bg-primary/5]="isSelected(item.id)"
            [class.border-border-light]="!isSelected(item.id)"
            [class.dark:border-border-dark]="!isSelected(item.id)"
            [class.hover:border-primary/50]="!isSelected(item.id)"
            [class.opacity-60]="item.code === 'POINTS'"
            [class.cursor-not-allowed]="item.code === 'POINTS'"
          >
            <div class="flex flex-col gap-2">
              <div class="flex items-center justify-between">
                <span
                  class="text-xs font-bold uppercase tracking-wider text-text-secondary dark:text-gray-500"
                >
                  {{ item.category }}
                </span>
                @if (isSelected(item.id)) {
                  <div
                    class="w-5 h-5 rounded-full bg-primary flex items-center justify-center animate-in zoom-in duration-200"
                  >
                    <span class="material-symbols-outlined text-white text-[14px]">check</span>
                  </div>
                }
              </div>
              <h4 class="font-bold text-text-main dark:text-white">{{ item.name }}</h4>
              <p class="text-xs text-text-secondary dark:text-gray-400 line-clamp-2 py-1">
                {{ item.description }}
              </p>
            </div>
          </button>
        }
      </div>
    </div>

    <!-- Modal Footer -->
    <div
      class="p-8 mt-auto flex items-center justify-end gap-4 bg-gray-50/50 dark:bg-white/5 border-t border-border-light dark:border-border-dark"
    >
      <button
        (click)="closeModal()"
        class="px-6 h-12 rounded-full font-bold text-text-main dark:text-white hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors"
      >
        Cancelar
      </button>
      <button
        (click)="confirmSelection()"
        class="px-8 h-12 rounded-full bg-primary text-white hover:bg-primary-dark font-bold shadow-lg shadow-primary/20 transition-all transform hover:-translate-y-0.5"
      >
        Confirmar Seleção
      </button>
    </div>
  </div>
</div>
