@if (isOpen()) {
  <button
    type="button"
    aria-label="Fechar modal"
    (click)="onBackdropClick()"
    class="fixed inset-0 z-50 flex items-center justify-center p-0 border-0 bg-black/60 backdrop-blur-sm animate-in fade-in duration-300 appearance-none text-left"
  >
    <div
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId"
      (click)="$event.stopPropagation()"
      (keydown.escape)="modalClose.emit()"
      tabindex="0"
      [class]="
        'bg-white dark:bg-slate-900 rounded-2xl shadow-2xl overflow-hidden transform transition-all animate-in zoom-in-95 slide-in-from-bottom-4 duration-300 ' +
        maxWidth()
      "
    >
      <!-- Header -->
      <div
        class="px-6 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between bg-slate-50/50 dark:bg-slate-800/50"
      >
        <div class="flex items-center gap-3">
          @if (icon()) {
            <div class="p-2 bg-primary/10 rounded-lg">
              <span class="material-symbols-outlined text-primary text-xl">
                {{ icon() }}
              </span>
            </div>
          }

          <h3 [id]="titleId" class="text-lg font-bold text-slate-900 dark:text-white">
            {{ title() }}
          </h3>
        </div>

        <button
          type="button"
          (click)="modalClose.emit()"
          class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500 transition-colors focus:outline-none focus:ring-2 focus:ring-primary/50"
          aria-label="Fechar modal"
        >
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <!-- Content -->
      <div class="p-6 max-h-[80vh] overflow-y-auto custom-scrollbar">
        <ng-content></ng-content>
      </div>

      <!-- Footer (Optional) -->
      <div
        class="px-6 py-4 bg-slate-50/50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-800 flex justify-end gap-3"
      >
        <ng-content select="[footer]"></ng-content>
      </div>
    </div>
  </button>
}
